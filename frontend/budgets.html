<!DOCTYPE html>
<html lang="en">
<head>
<title>FinTrack · Budgets &amp; goals</title>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="assets/icon.svg">
<link href="vendor/bootstrap/bootstrap.min.css" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>
<a class="visually-hidden-focusable" href="#content">Skip to content</a>
<div class="ft-app">
  <aside class="ft-card ft-side" id="sidebar"></aside>
  <main class="ft-main" id="content">
    <header class="ft-top" id="topbar"></header>
    <div class="ft-grid-4" id="stats"></div>

    <div class="ft-row" style="align-items:stretch">
      <section class="ft-card d-flex flex-column gap-2" style="flex:3 1 560px">
        <div><h2 class="ft-label">Monthly budgets</h2><p class="ft-muted mt-1">A limit for each expense category. Shan warns you when you go over.</p></div>
        <form id="budgetForm" class="d-flex flex-wrap gap-2 mt-2" style="background:var(--ft-soft);border-radius:16px;padding:12px" aria-label="Set a budget" novalidate>
          <select id="bCategory" aria-label="Category" class="ft-input" style="flex:1 1 180px"></select>
          <input id="bLimit" aria-label="Monthly limit in rupees" class="ft-input" inputmode="decimal" placeholder="Monthly limit (Rs)" style="flex:1 1 160px" autocomplete="off">
          <button class="ft-btn" id="budgetBtn"><span data-i="plus"></span>Set budget</button>
        </form>
        <div id="budgetRows"></div>
      </section>
      <aside class="ft-card ft-tip d-flex flex-column gap-3" style="flex:1 1 300px" id="tip"></aside>
    </div>

    <div class="d-flex justify-content-between align-items-center mt-1" id="goals">
      <h2 class="m-0" style="font-family:'Space Grotesk',sans-serif;font-size:20px;font-weight:600">Savings goals</h2>
    </div>
    <div class="ft-grid-3" style="grid-template-columns:repeat(auto-fit,minmax(300px,1fr))" id="goalCards"></div>
  </main>
</div>
<nav class="ft-tabbar" id="tabbar" aria-label="Main"></nav>

<script src="vendor/bootstrap/bootstrap.bundle.min.js"></script>
<script src="js/icons.js"></script>
<script src="js/api.js"></script>
<script src="js/layout.js"></script>
<script>
  shell.render('budgets.html', { title: 'Budgets & goals', sub: 'Spend with a plan, save with a target', actions: shell.monthPicker('month') });
  document.querySelectorAll('[data-i]').forEach((el) => { el.outerHTML = icon(el.dataset.i, 18); });
  const $ = (id) => document.getElementById(id);
  let budgets = [], goals = [];
  const toNumber = (v) => Number(String(v).replace(/[,\s]/g, '').replace(/^rs/i, ''));
  const goalIcon = (name) => (/laptop|computer|phone|mobile/i.test(name) ? 'laptop' : /emergency|fund|safe|rainy/i.test(name) ? 'shield' : /car|bike/i.test(name) ? 'car' : /home|house/i.test(name) ? 'home' : 'target');

  async function load() {
    const month = $('month').value;
    const [b, g, categories] = await Promise.all([api('/budgets?month=' + month), api('/goals'), api('/categories')]);
    budgets = b; goals = g;
    const limit = budgets.reduce((s, x) => s + Number(x.limit_amount), 0);
    const spent = budgets.reduce((s, x) => s + Number(x.spent), 0);
    const left = Math.max(0, limit - spent);
    const savedTotal = goals.reduce((s, x) => s + Number(x.saved_amount), 0);
    const progress = monthProgress(month);

    $('stats').innerHTML = [
      ['Total budget', money(limit), 'pie', `${budgets.length} categor${budgets.length === 1 ? 'y' : 'ies'}`],
      ['Spent', money(spent), 'down', limit ? `${pct(spent, limit)}% of budget` : 'No budgets yet'],
      ['Left to spend', money(left), 'wallet', progress.daysLeft ? `for ${progress.daysLeft} more day${progress.daysLeft === 1 ? '' : 's'}` : monthName(month)],
      ['Saved in goals', money(savedTotal), 'target', `${goals.length} goal${goals.length === 1 ? '' : 's'}`],
    ].map(([t, v, i, n]) => `<div class="ft-card ft-stat"><div class="d-flex justify-content-between align-items-center"><p class="t">${t}</p><span class="ft-save soft" style="color:#334155">${icon(i, 18)}</span></div>
      <p class="ft-big" style="font-size:28px">${v}</p><p class="ft-muted">${n}</p></div>`).join('');

    // budget form: expense categories, ones without a budget first
    const has = new Set(budgets.map((x) => x.category_id));
    const expenseCats = categories.filter((c) => c.type === 'expense').sort((a, c) => has.has(a.category_id) - has.has(c.category_id));
    const keep = $('bCategory').value;
    $('bCategory').innerHTML = expenseCats.map((c) => `<option value="${c.category_id}">${esc(c.name)}${has.has(c.category_id) ? ' (change limit)' : ''}</option>`).join('');
    if (keep && expenseCats.some((c) => String(c.category_id) === keep)) $('bCategory').value = keep;

    // budget rows
    $('budgetRows').innerHTML = budgets.map((x, i) => {
      const p = pct(x.spent, x.limit_amount);
      const over = Number(x.spent) > Number(x.limit_amount);
      const status = over ? 'over' : p >= 80 ? 'near' : 'ok';
      const tag = { over: ['alert', `Over by ${money(Number(x.spent) - Number(x.limit_amount))}`], near: ['alert', 'Close to limit'], ok: ['check', 'On track'] }[status];
      return `<div class="ft-brow">
        <div class="d-flex align-items-center gap-3" style="flex:1 1 180px;min-width:0"><span class="ft-cat">${icon(catIcon(x.category), 20)}</span>
          <div style="min-width:0"><p class="m-0 fw-semibold text-truncate">${esc(x.category)}</p><p class="ft-muted mt-1">${money(x.spent)} of ${money(x.limit_amount)}</p></div></div>
        <div class="d-flex flex-column gap-2" style="flex:3 1 240px">
          <div class="meter ft-stripe ${over ? 'over' : ''}" role="img" aria-label="${p}% used"><div style="width:${Math.min(p, 100)}%"></div>${over ? '<span class="limit" title="Limit"></span>' : ''}</div>
          <div class="d-flex justify-content-between" style="font-size:12px;color:var(--ft-muted)"><span>${p}% used</span><span>${money(Math.max(0, Number(x.limit_amount) - Number(x.spent)))} left</span></div>
        </div>
        <span class="ft-status ${status}">${icon(tag[0], 14)}${tag[1]}</span>
        <span class="d-inline-flex">
          <button class="ft-iconbtn sm" type="button" onclick="editBudget(${i})" aria-label="Change the ${esc(x.category)} limit">${icon('edit', 17)}</button>
          <button class="ft-iconbtn sm" type="button" onclick="deleteBudget(${i})" aria-label="Remove the ${esc(x.category)} budget">${icon('trash', 17)}</button></span>
      </div>`;
    }).join('') || `<p class="ft-empty">No budgets for ${monthName(month)} yet. Choose a category above and set a limit.</p>`;

    // the dark tip card
    const perDay = progress.daysLeft ? left / progress.daysLeft : 0;
    const overNames = budgets.filter((x) => Number(x.spent) > Number(x.limit_amount)).map((x) => x.category);
    const used = pct(spent, limit);
    $('tip').innerHTML = `<span style="width:44px;height:44px;border-radius:14px;background:rgba(255,255,255,.12);display:inline-flex;align-items:center;justify-content:center">${icon('pie', 22)}</span>
      <h2>${limit ? `${money(left)} left for ${progress.daysLeft ? 'the rest of ' : ''}${monthName(month).split(' ')[0]}` : 'Plan your month'}</h2>
      <p>${!limit ? 'Set a limit for the categories you spend most on, like Food or Transport, and FinTrack keeps count for you.'
        : progress.daysLeft && left > 0 ? `That's about <b style="color:#fff">${money(perDay)} a day</b> for ${progress.daysLeft} day${progress.daysLeft === 1 ? '' : 's'}.` : left > 0 ? 'Well done, you stayed within your total budget.' : 'You have used your whole budget for this month.'}
        ${overNames.length ? ` ${esc(overNames.join(', '))} ${overNames.length === 1 ? 'is' : 'are'} already over, so new spending there pushes the total further.` : ''}</p>
      <div class="d-flex flex-column gap-2 mt-1">
        <div class="d-flex justify-content-between" style="font-size:13px;color:#CBD5E1"><span>Month used</span><span style="color:#fff;font-weight:600">${progress.used}%</span></div>
        <div class="track"><div style="width:${progress.used}%;background:#fff"></div></div>
        <div class="d-flex justify-content-between" style="font-size:13px;color:#CBD5E1"><span>Budget used</span><span style="color:#fff;font-weight:600">${used}%</span></div>
        <div class="track"><div style="width:${Math.min(used, 100)}%;background:${used > 100 ? '#FBBF24' : 'var(--ft-accent)'}"></div></div>
      </div>`;

    // goals
    $('goalCards').innerHTML = goals.map((x, i) => {
      const p = Math.min(100, pct(x.saved_amount, x.target_amount));
      const remaining = Math.max(0, Number(x.target_amount) - Number(x.saved_amount));
      let plan = 'Goal reached. Well done!';
      if (remaining > 0 && x.deadline) {
        const end = new Date(x.deadline.slice(0, 10) + 'T00:00:00'), now = new Date();
        const months = Math.max(1, (end.getFullYear() - now.getFullYear()) * 12 + end.getMonth() - now.getMonth());
        plan = end < now ? 'The deadline has passed' : `Save ${money(Math.ceil(remaining / months))} a month for ${months} month${months === 1 ? '' : 's'}`;
      } else if (remaining > 0) plan = `${money(remaining)} to go`;
      return `<article class="ft-card ft-goal-card">
        <div class="top">
          <div class="dropdown"><button class="ft-iconbtn sm" data-bs-toggle="dropdown" aria-expanded="false" aria-label="Options for ${esc(x.goal_name)}">${icon('dots', 18)}</button>
            <ul class="dropdown-menu"><li><button class="dropdown-item text-danger" type="button" onclick="deleteGoal(${i})">${icon('trash', 16)}Delete goal</button></li></ul></div>
          <span class="ft-save" aria-hidden="true">${icon(goalIcon(x.goal_name), 18)}</span>
        </div>
        <div class="body">
          <div style="min-width:0"><h3 class="text-truncate">${esc(x.goal_name)}</h3><p class="ft-muted mt-1">${x.deadline ? 'By ' + dateLabel(x.deadline) : 'No deadline'} · ${money(x.target_amount)} target</p></div>
          <div class="d-flex align-items-center gap-4">
            <div class="ft-ring" role="img" aria-label="${p}% saved" style="width:96px;height:96px;background:conic-gradient(var(--ft-accent) 0 ${p}%, #EEF2F7 ${p}% 100%)">
              <div style="width:72px;height:72px"><span class="ft-big" style="font-size:21px">${p}%</span><span class="ft-muted" style="font-size:11px">saved</span></div></div>
            <div class="d-flex flex-column gap-1" style="min-width:0">
              <p class="ft-big" style="font-size:24px">${money(x.saved_amount)}</p><p class="ft-muted">saved of ${money(x.target_amount)}</p>
            </div>
          </div>
          <div class="ft-iconbox">${icon(remaining > 0 ? 'calendar' : 'check', 17)}<span>${plan}</span></div>
          <form class="d-flex gap-2" onsubmit="addSavings(event, ${i})" novalidate>
            <input aria-label="Amount to add to ${esc(x.goal_name)}" class="ft-input" inputmode="decimal" placeholder="Add savings (Rs)" style="flex:1" ${remaining > 0 ? '' : 'disabled'} autocomplete="off">
            <button class="ft-btn mint" ${remaining > 0 ? '' : 'disabled'}>Add</button>
          </form>
        </div>
      </article>`;
    }).join('') + `<button class="ft-dashed" type="button" id="newGoalBtn" onclick="newGoal()"><span class="plus">${icon('plus', 22)}</span>
      <span class="fw-semibold" style="font-size:14px">New savings goal</span><span class="ft-muted">A target, and a date if you like</span></button>`;
  }

  async function changed(message) { toast(message); await load(); shell.refresh(); }

  $('budgetForm').addEventListener('submit', attempt(async (e) => {
    e.preventDefault();
    const limit = toNumber($('bLimit').value);
    if (!$('bCategory').value) { toast('Add an expense category first, on the Accounts page.', 'danger'); return; }
    if (!(limit > 0)) { toast('Enter a monthly limit greater than zero.', 'danger'); $('bLimit').focus(); return; }
    await api('/budgets', { method: 'POST', body: { category_id: Number($('bCategory').value), limit_amount: limit, month: $('month').value } });
    $('bLimit').value = '';
    await changed('Budget saved');
  }));
  window.editBudget = (i) => {
    $('bCategory').value = budgets[i].category_id;
    $('bLimit').value = fmt(budgets[i].limit_amount);
    $('bLimit').focus();
    $('bLimit').select();
  };
  window.deleteBudget = attempt(async (i) => {
    const x = budgets[i];
    if (!await confirmAction({ title: `Remove the ${x.category} budget?`, text: `Your ${x.category} transactions stay; only the ${money(x.limit_amount)} limit for ${monthName($('month').value)} is removed.`, confirm: 'Remove' })) return;
    await api('/budgets/' + x.budget_id, { method: 'DELETE' });
    await changed('Budget removed');
  });

  window.newGoal = attempt(async () => {
    const v = await formDialog({ title: 'New savings goal', submit: 'Add goal', fields: [
      { name: 'goal_name', label: 'What are you saving for?', placeholder: 'e.g. New laptop', required: true, max: 100 },
      { name: 'target_amount', label: 'Target (Rs)', type: 'number', min: 1, required: true, placeholder: 'e.g. 180000' },
      { name: 'saved_amount', label: 'Already saved (Rs, optional)', type: 'number', min: 0, placeholder: '0' },
      { name: 'deadline', label: 'Deadline (optional)', type: 'date' }] });
    if (!v) return;
    if (!v.goal_name.trim() || !(Number(v.target_amount) > 0)) { toast('Give the goal a name and a target above zero.', 'danger'); return; }
    await api('/goals', { method: 'POST', body: { ...v, goal_name: v.goal_name.trim(), saved_amount: v.saved_amount || 0, deadline: v.deadline || null } });
    await changed('Goal added');
  });
  window.addSavings = attempt(async (e, i) => {
    e.preventDefault();
    const input = e.target.querySelector('input');
    const amount = toNumber(input.value);
    if (!(amount > 0)) { toast('Enter an amount greater than zero.', 'danger'); input.focus(); return; }
    const left = Number(goals[i].target_amount) - Number(goals[i].saved_amount);
    if (amount > left) { toast(`Only ${money(left)} is left to reach "${goals[i].goal_name}".`, 'danger'); input.value = fmt(left); input.focus(); return; }
    await api(`/goals/${goals[i].goal_id}/add`, { method: 'PATCH', body: { amount } });
    await changed(`Added ${money(amount)} to ${goals[i].goal_name}`);
  });
  window.deleteGoal = attempt(async (i) => {
    if (!await confirmAction({ title: `Delete "${goals[i].goal_name}"?`, text: 'The goal and its saved amount will be removed. Your accounts are not changed.' })) return;
    await api('/goals/' + goals[i].goal_id, { method: 'DELETE' });
    await changed('Goal deleted');
  });

  $('month').addEventListener('change', attempt(load));
  attempt(async () => {
    await load();
    if (location.hash === '#new-goal') { history.replaceState(null, '', location.pathname); newGoal(); }
    else if (location.hash === '#goals') document.getElementById('goals').scrollIntoView();
  })();
</script>
</body>
</html>
