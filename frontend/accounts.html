<!DOCTYPE html>
<html lang="en">
<head>
<title>FinTrack · Accounts</title>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="assets/icon.svg">
<link href="vendor/bootstrap/bootstrap.min.css" rel="stylesheet">
<link href="vendor/bootstrap-icons/bootstrap-icons.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>
<div id="navbar"></div>
<main class="container py-4">
  <h2 class="mb-4">Accounts &amp; Categories</h2>
  <div class="row g-3 mb-4" id="accountCards"></div>
  <div class="row g-3">
    <div class="col-lg-4"><div class="ft-card p-4 h-100">
      <h5>Add account</h5>
      <form id="accountForm">
        <input name="account_name" class="form-control mb-2" placeholder="e.g. HBL Bank" required>
        <select name="account_type" class="form-select mb-3"><option value="bank">Bank</option><option value="cash">Cash</option><option value="wallet">Wallet (JazzCash, Easypaisa)</option><option value="card">Card</option></select>
        <button class="btn btn-primary w-100">Add account</button>
      </form>
    </div></div>
    <div class="col-lg-4"><div class="ft-card p-4 h-100">
      <h5>Transfer money</h5>
      <form id="transferForm">
        <label class="form-label small">From</label><select name="from_account" class="form-select mb-2 acc-select" required></select>
        <label class="form-label small">To</label><select name="to_account" class="form-select mb-2 acc-select" required></select>
        <input type="number" name="amount" min="1" step="0.01" class="form-control mb-3" placeholder="Amount (Rs)" required>
        <button class="btn btn-primary w-100">Transfer</button>
      </form>
      <p class="small text-muted-ft mt-2 mb-0">Runs as one database transaction: both sides are saved, or neither.</p>
    </div></div>
    <div class="col-lg-4"><div class="ft-card p-4 h-100">
      <h5>Categories</h5>
      <form id="categoryForm" class="d-flex gap-2 mb-3">
        <input name="name" class="form-control" placeholder="New category" required>
        <select name="type" class="form-select" style="max-width:120px"><option value="expense">Expense</option><option value="income">Income</option></select>
        <button class="btn btn-primary"><i class="bi bi-plus-lg"></i></button>
      </form>
      <div id="categoryList" class="d-flex flex-wrap gap-2"></div>
    </div></div>
  </div>
</main>
<script src="vendor/bootstrap/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script>
  auth.requireLogin();
  renderNavbar('accounts.html');
  const icons = { bank: 'bank', cash: 'cash-stack', wallet: 'phone', card: 'credit-card' };
  const tints = ['bg-sky', 'bg-mint', 'bg-peach', 'bg-lav'];

  async function load() {
    const [accounts, categories] = await Promise.all([api('/accounts'), api('/categories')]);
    accountCards.innerHTML = accounts.map((a, i) => `<div class="col-sm-6 col-lg-3"><div class="ft-stat ${tints[i % 4]} h-100">
      <div class="d-flex justify-content-between"><div class="label"><i class="bi bi-${icons[a.account_type]} me-1"></i>${esc(a.account_type)}</div>
      <button class="btn btn-sm btn-link text-muted p-0" title="Delete" onclick="removeAccount(${a.account_id})"><i class="bi bi-trash"></i></button></div>
      <div class="fw-semibold mt-1">${esc(a.account_name)}</div><div class="value">${money(a.balance)}</div></div></div>`).join('');
    document.querySelectorAll('.acc-select').forEach((s) => s.innerHTML = accounts.map((a) => `<option value="${a.account_id}">${esc(a.account_name)} (${money(a.balance)})</option>`).join(''));
    categoryList.innerHTML = categories.map((c) => `<span class="badge rounded-pill ${c.type === 'income' ? 'text-bg-success' : 'text-bg-light'} p-2">
      ${esc(c.name)} <a href="#" class="ms-1 text-reset" onclick="removeCategory(${c.category_id});return false">×</a></span>`).join('');
  }

  const post = (path, form, msg) => async (e) => {
    e.preventDefault();
    try { await api(path, { method: 'POST', body: Object.fromEntries(new FormData(form)) }); form.reset(); toast(msg); load(); }
    catch (err) { toast(err.message, 'danger'); }
  };
  accountForm.addEventListener('submit', post('/accounts', accountForm, 'Account added'));
  transferForm.addEventListener('submit', post('/accounts/transfer', transferForm, 'Transfer complete'));
  categoryForm.addEventListener('submit', post('/categories', categoryForm, 'Category added'));

  async function removeAccount(id) {
    if (!confirm('Delete this account and all its transactions?')) return;
    try { await api('/accounts/' + id, { method: 'DELETE' }); toast('Account deleted'); load(); } catch (e) { toast(e.message, 'danger'); }
  }
  async function removeCategory(id) {
    try { await api('/categories/' + id, { method: 'DELETE' }); toast('Category deleted'); load(); } catch (e) { toast(e.message, 'danger'); }
  }
  load().catch((e) => toast(e.message, 'danger'));
</script>
</body>
</html>
