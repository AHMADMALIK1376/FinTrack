<!DOCTYPE html>
<html lang="en">
<head>
<title>FinTrack · Committees</title>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="assets/icon.svg">
<link href="vendor/bootstrap/bootstrap.min.css" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>
<a class="visually-hidden-focusable" href="#content">Skip to content</a>
<div class="ft-app">
  <aside class="ft-card ft-side" id="sidebar"></aside>
  <main class="ft-main" id="content">
    <header class="ft-top" id="topbar"></header>
    <div class="ft-grid-4" id="stats"></div>
    <div class="ft-grid-3" style="grid-template-columns:repeat(auto-fill,minmax(320px,1fr))" id="cards"></div>
    <div class="ft-row" style="align-items:stretch">
      <section class="ft-card d-flex flex-column gap-3" style="flex:2 1 560px">
        <div class="d-flex justify-content-between align-items-center"><h2 class="ft-label">Coming up</h2><span class="ft-muted">next 3 months</span></div>
        <div class="table-responsive"><table class="ft-table ft-upcoming"><thead><tr><th>When</th><th class="c-col">Committee</th><th>What</th><th class="text-end">Amount</th></tr></thead>
          <tbody id="upcoming"></tbody></table></div>
        <div class="d-flex align-items-center gap-3" style="background:var(--ft-bg);border-radius:16px;padding:12px 14px">
          <img src="assets/shan.svg" alt="" width="40" height="48" style="flex:none">
          <p class="m-0" style="font-size:13px;color:#334155;line-height:1.5" id="shanBc"></p>
        </div>
      </section>
      <section class="ft-card d-flex flex-column gap-3" style="flex:1 1 360px">
        <div class="d-flex justify-content-between align-items-center"><h2 class="ft-label">Invitations</h2><span id="inviteCount"></span></div>
        <div id="invites" class="d-flex flex-column gap-3"></div>
        <form class="d-flex gap-2 align-items-center pt-1" id="codeForm">
          <input class="ft-input ft-upper" id="codeInput" aria-label="Committee code" placeholder="Have a code? e.g. FAM-7K2Q" maxlength="9" autocomplete="off">
          <button class="ft-btn" style="background:var(--ft-ink)">Join</button>
        </form>
      </section>
    </div>
  </main>
</div>
<nav class="ft-tabbar" id="tabbar" aria-label="Main"></nav>

<script src="vendor/bootstrap/bootstrap.bundle.min.js"></script>
<script src="js/icons.js"></script>
<script src="js/api.js"></script>
<script src="js/layout.js"></script>
<script src="js/committees.js"></script>
<script>
  shell.render('committees.html', {
    title: 'Committees', sub: 'Save together with family and friends: everyone pays in, everyone gets a turn',
    actions: `<button class="ft-chip-btn" type="button" id="joinBtn">${icon('link', 18)}Join with a code</button>
              <button class="ft-btn" type="button" id="newBtn">${icon('plus', 18)}Start a committee</button>`,
  });
  const $ = (id) => document.getElementById(id);
  const todayIso = today();
  let list = [];

  /** Where the user's payment for the current round stands, as a tag. */
  function payTag(c) {
    const organizer = c.is_organizer ? 'you' : c.organizer_name.split(' ')[0];
    if (c.my_confirmed_at) return bcTag('Paid · confirmed', 'ok', 'check');
    if (c.my_marked_at) return bcTag(`Paid · waiting for ${organizer} to confirm`, 'wait', 'clock');
    const due = `${String(c.current_month).slice(0, 8)}${String(c.due_day).padStart(2, '0')}`;
    return todayIso > due ? bcTag(`Late · due ${bcDay(c.current_month, c.due_day)}`, 'late', 'alert') : bcTag(`Not paid yet · due ${c.due_day} ${bcMonth(c.current_month).split(' ')[0]}`, 'due');
  }

  function card(c) {
    const pot = c.amount * c.member_count;
    let band; let middle; let note; let buttons;
    const open = `<a class="ft-btn" style="flex:1" href="committee.html?id=${c.committee_id}">Open${icon('arrowr', 18)}</a>`;
    if (c.status === 'forming') {
      const left = c.member_count - c.approved_count;
      band = `Getting ready · ${c.approved_count} of ${c.member_count} joined`;
      middle = `<div class="ft-rounds" role="img" aria-label="${c.approved_count} of ${c.member_count} places filled">${Array.from({ length: c.member_count }, (_, i) => `<span class="${i < c.approved_count ? 'done' : ''}"></span>`).join('')}</div>`;
      note = left ? `Waiting for <b>${left} more ${left === 1 ? 'person' : 'people'}</b>. Share the code <b>${esc(c.invite_code)}</b>.`
        : (c.is_organizer ? 'Everyone has joined. <b>Open it and start the committee.</b>' : `Everyone has joined. ${esc(c.organizer_name)} will start it soon.`);
      if (c.requests) note += ` <b>${c.requests} waiting for your approval.</b>`;
      buttons = open + `<button class="ft-chip-btn" style="flex:1;justify-content:center" data-share="${c.committee_id}">${icon('share', 18)}WhatsApp</button>`;
    } else if (c.status === 'active') {
      band = `Round ${c.current_round} of ${c.member_count}`;
      middle = bcRounds(c.rounds_done, c.member_count);
      const turn = c.my_turn ? `<b>Your turn: round ${c.my_turn}, ${bcMonth(c.my_payout_month, true)}.</b>` : '<b>The organizer picks each month.</b>';
      note = c.i_receive_now ? `<b>It's your turn this month: you get ${money(pot)}.</b>`
        : c.my_paid_out_at ? `${c.current_receiver ? `This month <b>${esc(c.current_receiver)}</b> gets the pot. ` : ''}You've had your turn.`
          : `${c.current_receiver ? `This month <b>${esc(c.current_receiver)}</b> gets the pot. ` : ''}${turn}`;
      buttons = open + `<button class="ft-chip-btn" style="flex:1;justify-content:center;white-space:nowrap" data-paid="${c.committee_id}" ${c.my_marked_at ? 'disabled' : ''}>${icon('check', 18)}${c.my_marked_at ? 'Paid' : 'I\'ve paid'}</button>`;
    } else {
      band = 'Finished';
      middle = bcRounds(c.member_count, c.member_count);
      note = `Everyone has had their turn. You paid in ${money(c.my_paid_in)}.`;
      buttons = open;
    }
    return `<article class="ft-card ft-goal-card">
      <div class="top"><span style="position:relative;color:#fff;font-size:12px;font-weight:600;background:rgba(255,255,255,.18);border-radius:999px;padding:5px 10px">${esc(band)}</span>
        <span class="ft-save">${icon(bcIcon(c.name), 18)}</span></div>
      <div class="body">
        <div class="d-flex justify-content-between align-items-start gap-3">
          <div style="min-width:0"><h3>${esc(c.name)}</h3><p class="ft-muted mt-1">${money(c.amount)} a month · ${c.member_count} members · ${bcRange(c.start_month, c.member_count)}</p></div>
          <div class="text-end" style="flex:none"><p class="ft-big" style="font-size:20px;white-space:nowrap">${money(pot)}</p><p class="ft-muted mt-1" style="white-space:nowrap">pot each month</p></div>
        </div>
        ${middle}
        <div class="d-flex justify-content-between align-items-center gap-2 flex-wrap">
          <span class="ft-muted">${c.is_organizer ? 'You organize this' : `By ${esc(c.organizer_name)}`}</span>
          ${c.status === 'active' ? payTag(c) : ''}
        </div>
        <div class="ft-iconbox">${icon('gift', 17)}<span>${note}</span></div>
        <div class="d-flex gap-2">${buttons}</div>
      </div></article>`;
  }

  async function load() {
    list = await api('/committees');
    const mine = list.filter((c) => c.my_status === 'approved');
    const active = mine.filter((c) => c.status === 'active');
    const waiting = list.filter((c) => c.my_status !== 'approved');
    const invites = list.filter((c) => c.my_status === 'invited');
    const next = active.filter((c) => c.my_payout_month && !c.my_paid_out_at).sort((a, b) => a.my_payout_month.localeCompare(b.my_payout_month))[0];

    $('stats').innerHTML = [
      ['Paying in each month', money(active.reduce((s, c) => s + Number(c.amount), 0)), 'up', `${active.length} committee${active.length === 1 ? '' : 's'}`],
      ['Your next payout', next ? money(next.amount * next.member_count) : '—', 'gift', next ? `${esc(next.name)} · ${bcMonth(next.my_payout_month, true)}` : 'after the order is set'],
      ['Paid in so far', money(mine.reduce((s, c) => s + Number(c.my_paid_in), 0)), 'wallet', 'you get it all back on your turns'],
      ['Committees', `${active.length} active`, 'users', invites.length ? `${invites.length} invitation${invites.length === 1 ? '' : 's'} waiting` : `${mine.length - active.length} getting ready or finished`],
    ].map(([t, v, i, n]) => `<div class="ft-card ft-stat"><div class="d-flex justify-content-between align-items-center"><p class="t">${t}</p><span class="ft-save soft" style="color:#334155">${icon(i, 18)}</span></div>
      <p class="ft-big" style="font-size:28px">${v}</p><p class="ft-muted">${n}</p></div>`).join('');

    $('cards').innerHTML = mine.map(card).join('') + `<button class="ft-dashed" type="button" id="newCard" style="min-height:380px">
      <span class="plus">${icon('plus', 24)}</span><span style="font-size:15px;font-weight:600">Start a committee</span>
      <span class="ft-muted text-center" style="max-width:220px;line-height:1.5">Pick an amount and how many people, then invite them with a code or a WhatsApp link</span></button>`;

    // the next three months of payments and payouts
    const until = bcAddMonths(`${thisMonth()}-01`, 3);
    const rows = [];
    for (const c of active) {
      for (let r = c.current_round; r <= c.member_count; r++) {
        const month = bcAddMonths(c.start_month, r - 1);
        if (month >= until) break;
        if (!(r === c.current_round && c.my_marked_at)) rows.push({ date: month.slice(0, 8) + String(c.due_day).padStart(2, '0'), c, pay: true });
        if (c.my_payout_month && month === String(c.my_payout_month).slice(0, 10) && !c.my_paid_out_at) rows.push({ date: month.slice(0, 8) + String(c.payout_day).padStart(2, '0'), c, pay: false });
      }
    }
    rows.sort((a, b) => a.date.localeCompare(b.date));
    $('upcoming').innerHTML = rows.slice(0, 6).map(({ date, c, pay }) => `<tr><td>${bcDate(date)}<a class="sub" href="committee.html?id=${c.committee_id}">${esc(c.name)}</a></td>
      <td class="c-col"><a href="committee.html?id=${c.committee_id}">${esc(c.name)}</a></td>
      <td>${pay ? bcTag('You pay', 'due', 'up') : bcTag('Your turn: you receive', 'ok', 'gift')}</td>
      <td class="text-end fw-semibold" style="${pay ? '' : 'color:#166534'}">${pay ? '−' + money(c.amount) : '+' + money(c.amount * c.member_count)}</td></tr>`).join('')
      || `<tr><td colspan="4" class="ft-empty">Nothing due. Start or join a committee to see payments here.</td></tr>`;

    if (next) {
      const weeks = Math.max(0, Math.round((new Date(`${String(next.my_payout_month).slice(0, 8)}${String(next.payout_day).padStart(2, '0')}T00:00:00`) - new Date()) / (7 * 864e5)));
      $('shanBc').innerHTML = `<b>Shan says:</b> your ${esc(next.name)} turn is ${weeks ? `in ${weeks} week${weeks === 1 ? '' : 's'}` : 'this month'}. ${money(next.amount * next.member_count)} is coming in ${bcMonth(next.my_payout_month, true).split(' ')[0]}. Want to put some of it towards a <a href="budgets.html#goals">savings goal</a>?`;
    } else {
      $('shanBc').innerHTML = '<b>Shan says:</b> a committee is a simple way to save a big amount: pay a little each month, and get the whole pot once, on your turn.';
    }

    $('inviteCount').innerHTML = waiting.length ? bcTag(`${waiting.length} waiting`, 'you') : '';
    $('invites').innerHTML = waiting.map((c) => `<div style="border:1px solid var(--ft-line);border-radius:18px;padding:16px" class="d-flex flex-column gap-3">
      <div class="d-flex gap-3 align-items-center">${bcAvatar(c.organizer_name, 2, 'width:40px;height:40px')}<div>
        <p class="m-0" style="font-size:14px">${c.my_status === 'invited' ? `<b>${esc(c.organizer_name)}</b> invited you to` : 'You asked to join'}</p>
        <p class="m-0 mt-1 fw-semibold" style="font-size:16px">${esc(c.name)}</p></div></div>
      <div class="d-flex flex-wrap gap-2"><span class="ft-pill">${icon('cash', 14)}${money(c.amount)} a month</span><span class="ft-pill">${icon('users', 14)}${c.approved_count} of ${c.member_count} joined</span>
        <span class="ft-pill">${icon('calendar', 14)}Starts ${bcMonth(c.start_month)}</span><span class="ft-pill">${icon(BC_METHODS[c.payout_method].icon, 14)}${esc(BC_METHODS[c.payout_method].short)}</span></div>
      ${c.my_status === 'invited'
        ? `<div class="d-flex gap-2"><button class="ft-btn" style="flex:1" data-accept="${c.committee_id}">${icon('check', 18)}Join</button><button class="ft-btn light" style="flex:1" data-decline="${c.committee_id}:${c.member_id}">No thanks</button></div>`
        : `<div class="d-flex gap-2 align-items-center">${bcTag(`Waiting for ${c.organizer_name.split(' ')[0]} to approve`, 'wait', 'clock')}<button class="ft-btn light ms-auto" data-decline="${c.committee_id}:${c.member_id}">Cancel request</button></div>`}
    </div>`).join('') || '<p class="ft-muted m-0">No invitations right now. When someone invites you, it shows up here.</p>';
  }

  async function startNew() {
    const c = await bcCreateDialog();
    if (c) location.href = `committee.html?id=${c.committee_id}&invite=1`;
  }
  async function join(code = '') {
    const r = await bcJoinDialog(code);
    if (!r) return;
    if (r.status === 'approved') { location.href = `committee.html?id=${r.committee_id}`; return; }
    toast(`You've asked to join ${r.name}. The organizer will approve you.`);
    load();
    shell.refresh();
  }

  $('newBtn').addEventListener('click', startNew);
  $('joinBtn').addEventListener('click', () => join());
  $('codeForm').addEventListener('submit', (e) => { e.preventDefault(); join($('codeInput').value.trim().toUpperCase()); });
  document.addEventListener('click', attempt(async (e) => {
    const b = e.target.closest('button');
    if (!b) return;
    if (b.id === 'newCard') return startNew();
    if (b.dataset.share) {
      const c = list.find((x) => String(x.committee_id) === b.dataset.share);
      return bcWhatsApp(`Join my committee "${c.name}" on FinTrack: ${money(c.amount)} a month, ${c.member_count} people. Code: ${c.invite_code}\n${bcInviteLink(c.invite_code)}`);
    }
    if (b.dataset.paid) {
      const c = list.find((x) => String(x.committee_id) === b.dataset.paid);
      if (!await confirmAction({ title: 'Mark as paid?', text: `You paid ${money(c.amount)} for ${c.name}, round ${c.current_round}. ${c.is_organizer ? 'You can confirm it on the committee page.' : `${c.organizer_name} will confirm it.`}`, confirm: 'Yes, I\'ve paid', danger: false })) return;
      await api(`/committees/${c.committee_id}/rounds/${c.current_round_id}/paid`, { method: 'POST' });
      toast('Marked as paid.');
    } else if (b.dataset.accept) {
      await api(`/committees/${b.dataset.accept}/accept`, { method: 'POST' });
      location.href = `committee.html?id=${b.dataset.accept}`;
      return;
    } else if (b.dataset.decline) {
      const [cid, mid] = b.dataset.decline.split(':');
      await api(`/committees/${cid}/members/${mid}`, { method: 'DELETE' });
      toast('Done.');
    } else return;
    await load();
    shell.refresh();
  }));

  load().then(() => {
    const code = new URLSearchParams(location.search).get('join');
    if (code) { history.replaceState(null, '', 'committees.html'); join(code.toUpperCase()); }
  }).catch((e) => toast(e.message, 'danger'));
</script>
</body>
</html>
