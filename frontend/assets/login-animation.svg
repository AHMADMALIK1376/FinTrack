<?xml version="1.0" encoding="UTF-8"?>
<svg class="ft2" viewBox="0 0 620 420" role="img" aria-label="Animation: Shan the snow leopard waving beside a money-flow chart, a balance card, income and expense bars growing month by month, a rising savings line, a savings goal filling to 72 percent, and notifications for a salary, a budget alert and a transfer" font-family="Inter, Segoe UI, system-ui, sans-serif" xmlns="http://www.w3.org/2000/svg" width="620" height="420">
  <style>
.ft2 .rise{animation:ft2-rise 10s cubic-bezier(.2,.9,.25,1.1) infinite both}
.ft2 .bar{transform-box:fill-box;transform-origin:50% 100%;animation:ft2-grow 10s cubic-bezier(.3,1.5,.5,1) infinite both}
.ft2 .line{stroke-dasharray:440;animation:ft2-draw 10s ease-in-out 1.6s infinite both}
.ft2 .glow{stroke-dasharray:440;animation:ft2-draw 10s ease-in-out 1.6s infinite both;opacity:.35}
.ft2 .runner{offset-rotate:0deg;animation:ft2-run 10s ease-in-out 1.6s infinite both}
.ft2 .pulse{transform-box:fill-box;transform-origin:center;animation:ft2-pulse 1.8s ease-out 3.1s infinite both}
.ft2 .ring{stroke-dasharray:239;stroke-dashoffset:67;animation:ft2-ring 10s cubic-bezier(.4,0,.2,1) 1.9s infinite both}
.ft2 .pop{transform-box:fill-box;transform-origin:center;animation:ft2-pop 10s cubic-bezier(.3,1.6,.5,1) infinite both}
.ft2 .toast{animation:ft2-toast 10s cubic-bezier(.3,1.4,.5,1) infinite both}
.ft2 .shine{animation:ft2-shine 10s ease-in-out .5s infinite both}
.ft2 .coin{transform-box:fill-box;transform-origin:center;animation:ft2-float 7s linear infinite both}
.ft2 .spark{transform-box:fill-box;transform-origin:center;animation:ft2-twinkle 2.6s ease-in-out infinite both}
@keyframes ft2-rise{0%{transform:translateY(24px);opacity:0}7%{transform:translateY(0);opacity:1}88%{transform:translateY(0);opacity:1}96%,100%{transform:translateY(-8px);opacity:0}}
@keyframes ft2-grow{0%{transform:scaleY(0)}10%{transform:scaleY(1)}86%{transform:scaleY(1);opacity:1}94%,100%{transform:scaleY(1);opacity:0}}
@keyframes ft2-draw{0%{stroke-dashoffset:440}16%{stroke-dashoffset:0}80%{stroke-dashoffset:0;opacity:1}88%,100%{stroke-dashoffset:0;opacity:0}}
@keyframes ft2-run{0%{offset-distance:0%;opacity:0}2%{opacity:1}16%{offset-distance:100%}80%{offset-distance:100%;opacity:1}88%,100%{offset-distance:100%;opacity:0}}
@keyframes ft2-pulse{0%{transform:scale(.6);opacity:0}8%{opacity:.7}100%{transform:scale(2.6);opacity:0}}
@keyframes ft2-ring{0%{stroke-dashoffset:239}18%{stroke-dashoffset:67}78%{stroke-dashoffset:67;opacity:1}86%,100%{stroke-dashoffset:67;opacity:0}}
@keyframes ft2-pop{0%{transform:scale(0);opacity:0}6%{transform:scale(1);opacity:1}80%{transform:scale(1);opacity:1}88%,100%{transform:scale(.9);opacity:0}}
@keyframes ft2-toast{0%{transform:translateX(40px);opacity:0}6%{transform:translateX(0);opacity:1}62%{transform:translateX(0);opacity:1}70%,100%{transform:translateX(40px);opacity:0}}
@keyframes ft2-shine{0%{transform:translateX(-120px)}12%,100%{transform:translateX(320px)}}
@keyframes ft2-float{0%{transform:translateY(40px) rotate(0deg);opacity:0}15%{opacity:.9}85%{opacity:.9}100%{transform:translateY(-420px) rotate(25deg);opacity:0}}
@keyframes ft2-twinkle{0%,100%{transform:scale(.4);opacity:.2}50%{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion: reduce){.ft2 *{animation:none!important}.ft2 .coin,.ft2 .spark,.ft2 .runner,.ft2 .pulse{display:none}}

.shan{transform-box:fill-box;transform-origin:50% 100%;animation:shan-bob 3s ease-in-out infinite}
.shan .eyes{transform-box:fill-box;transform-origin:center;animation:shan-blink 4.5s ease-in-out infinite}
.shan .wave{transform-box:fill-box;transform-origin:0% 100%;animation:shan-wave 1.6s ease-in-out infinite}
.shan .tail{transform-box:fill-box;transform-origin:0% 100%;animation:shan-tail 2.8s ease-in-out infinite}
.shan-cheer{transform-box:fill-box;transform-origin:50% 100%;animation:shan-cheer 9s ease-out 2.6s infinite both}
.shan-say{transform-box:fill-box;transform-origin:20% 100%;animation:shan-say 9s cubic-bezier(.2,.8,.2,1) 4.6s infinite both}
@keyframes shan-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes shan-blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes shan-wave{0%,100%{transform:rotate(-10deg)}50%{transform:rotate(14deg)}}
@keyframes shan-tail{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(5deg)}}
@keyframes shan-cheer{0%,8%,100%{transform:translateY(0) scale(1)}3%{transform:translateY(-16px) scale(1.04)}5%{transform:translateY(0) scale(1.06,.94)}}
@keyframes shan-say{0%{transform:scale(0);opacity:0}6%{transform:scale(1.06);opacity:1}9%{transform:scale(1)}68%{transform:scale(1);opacity:1}76%,100%{transform:scale(.8);opacity:0}}
@media (prefers-reduced-motion: reduce){.shan,.shan *,.shan-cheer,.shan-say{animation:none!important}}
</style>
