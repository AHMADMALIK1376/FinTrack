# Runs on every push and pull request to main and dev:
# builds a fresh PostgreSQL database from database/*.sql, runs the database tests, then starts the
# PHP backend and runs the API tests against it.
# A red build is never merged (planning rule: plan.md section 11.2).
name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  test:
    name: test (PostgreSQL ${{ matrix.postgres }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 16 = oldest we support in CI; 18 = what the team runs on their laptops
        postgres: ['16', '18']
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: fintrack_app            # the API connects as the limited role (DB-10)
      PGPASSWORD: fintrack_app_local
      PGADMIN_USER: postgres          # tests rebuild the database as the admin
      PGADMIN_PASSWORD: postgres
      TEST_PGDATABASE: fintrack_test
      JWT_SECRET: ci-only-secret
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_pgsql
          coverage: none
      - name: PHP syntax check
        run: for f in router.php $(find src -name '*.php'); do php -l "$f"; done
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Database scripts and seed run cleanly on an empty database (DB-08)
        env:
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          createdb fintrack_seed_check
          for f in ../database/[0-9][0-9]_*.sql; do psql -v ON_ERROR_STOP=1 -q -d fintrack_seed_check -f "$f"; done
          psql -v ON_ERROR_STOP=1 -q -d fintrack_seed_check -f ../database/demo/committees_demo.sql
          psql -v ON_ERROR_STOP=1 -q -d fintrack_seed_check -f ../database/demo/sms_demo.sql
      - name: Database tests, and API tests against the PHP server
        run: npm test
      - name: Security audit of the test tools
        run: npm audit --audit-level=high

  hosting:
    # The way FinTrack runs online: the one-command installer sets up an empty database, then the
    # Docker image (what Render runs) starts with only DATABASE_URL and JWT_SECRET, and is used.
    name: hosting (Docker image + installer)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17            # what Neon runs by default
        env:
          POSTGRES_USER: owner
          POSTGRES_PASSWORD: owner_pw
          POSTGRES_DB: neondb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U owner"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_pgsql
          coverage: none
      - name: Install the database in one command (as the owner, like on Neon)
        run: |
          php backend/bin/install-db.php "postgresql://owner:owner_pw@localhost:5432/neondb?sslmode=disable" --with-demo | tee install.txt
          grep -o 'postgresql://fintrack_app:[^ ]*' install.txt > app_url.txt
      - name: A second install refuses to wipe the data
        run: |
          if php backend/bin/install-db.php "postgresql://owner:owner_pw@localhost:5432/neondb?sslmode=disable"; then
            echo "should have refused"; exit 1
          fi
      - name: Build the Docker image
        run: docker build -t fintrack .
      - name: Start it with only DATABASE_URL and JWT_SECRET, as on Render
        run: |
          docker run -d --name fintrack --network host -e PORT=10000 \
            -e DATABASE_URL="$(cat app_url.txt)" -e JWT_SECRET=ci-hosting-secret \
            -e CLIENT_IP_HEADER=True-Client-IP fintrack
          for i in $(seq 1 30); do curl -fs http://localhost:10000/api/health && break; sleep 1; done
          curl -fs http://localhost:10000/api/health | grep -q '"database_role":"fintrack_app"'
      - name: Use it - pages, log-in, data, the app's CORS
        run: |
          B=http://localhost:10000
          curl -fs $B/index.html | grep -q FinTrack
          TOKEN=$(curl -fs -X POST $B/api/auth/login -H 'Content-Type: application/json' \
                  -d '{"email":"demo@fintrack.pk","password":"demo1234"}' | python3 -c 'import sys,json; print(json.load(sys.stdin)["token"])')
          curl -fs $B/api/imports -H "Authorization: Bearer $TOKEN" | python3 -c 'import sys,json; c=json.load(sys.stdin)["counts"]; assert c["pending"] == 5, c'
          curl -fs $B/api/committees -H "Authorization: Bearer $TOKEN" | python3 -c 'import sys,json; assert len(json.load(sys.stdin)) == 3'
          curl -s -i -X OPTIONS $B/api/accounts -H 'Origin: https://localhost' | grep -qi '^access-control-allow-origin: https://localhost'
          ! curl -s -i -X OPTIONS $B/api/accounts -H 'Origin: https://evil.example' | grep -qi '^access-control-allow-origin'
          ! curl -fs $B/.env
          ! curl -fs $B/../backend/src/env.php
      - name: Server log
        if: always()
        run: docker logs fintrack || true

  android:
    # Builds the Android app (mobile/) and keeps the APK as a download on the run's page.
    # On main it is also published as the "FinTrack for Android (latest)" release, to download on a phone.
    name: android app (APK)
    runs-on: ubuntu-latest
    permissions:
      contents: write                # only to publish that release
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'         # Capacitor 8 needs Java 21
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - name: Pages into the app, pointed at the FinTrack server
        run: npm run sync
      - name: Signing key (the same one every build, so updates install over the old app)
        env:
          FT_KEYSTORE_B64: ${{ secrets.FT_KEYSTORE_B64 }}
        run: |
          if [ -n "$FT_KEYSTORE_B64" ]; then
            echo "$FT_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/fintrack.jks"
            echo "FT_KEYSTORE=$RUNNER_TEMP/fintrack.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::FT_KEYSTORE_B64 secret not set: this APK uses a one-off key and can't update an installed app"
          fi
      - name: Test the SMS filter, then build the APK
        working-directory: mobile/android
        env:
          FT_KEYSTORE_PASSWORD: ${{ secrets.FT_KEYSTORE_PASSWORD }}
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: FinTrack-android
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
      - name: Publish the APK as the latest Android release (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: mobile/android/app/build/outputs/apk/debug
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app-debug.apk FinTrack.apk
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest FinTrack.apk --prerelease \
            --title "FinTrack for Android (latest)" --target "$GITHUB_SHA" \
            --notes "Built from ${GITHUB_SHA::7}. On your phone: download FinTrack.apk, open it, allow installing from this source, install. Then log in and go to SMS import > Turn on automatic SMS."
